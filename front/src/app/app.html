<mat-toolbar color="primary">
  <span class="toolbar-title">Bingo List</span>
      <span class="score">{{ checkedCount }} / {{ total }}</span>
  <span class="toolbar-spacer"></span>
  <button mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
    <mat-icon>home</mat-icon>
    Ma Bingo Liste
  </button>
  <button mat-button routerLink="/edit" routerLinkActive="active-link">
    <mat-icon>edit</mat-icon>
    Éditer
  </button>
</mat-toolbar>

<router-outlet />
